<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>課後小測驗｜網頁前端入門</title>

    <style>
      /* 基本設定 */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f3f8fa;
        color: #172c46;
        font-family: 'Microsoft JhengHei', sans-serif;
        line-height: 1.7;
      }

      button,
      input {
        font: inherit;
      }

      a {
        color: #006b79;
      }

      button,
      a,
      input {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 3px solid #00899a;
        outline-offset: 4px;
      }

      .container {
        width: calc(100% - 40px);
        max-width: 800px;
        margin: 0 auto;
      }

      /* 頁首 */
      .header {
        padding: 18px 0;
        background: white;
        border-bottom: 1px solid #dfe9ef;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .logo {
        font-size: 19px;
        font-weight: bold;
        text-decoration: none;
      }

      /* 測驗介紹 */
      main {
        padding: 36px 0;
      }

      .intro {
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #006b79;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 36px);
      }

      .description {
        margin: 0;
        color: #5f7085;
      }

      .progress {
        margin-top: 16px;
        color: #006b79;
        font-weight: bold;
      }

      /* 題目卡片 */
      .question-card {
        min-width: 0;
        margin: 0 0 20px;
        padding: 24px;
        background: white;
        border: 1px solid #dfe9ef;
        border-radius: 16px;
      }

      .question-card legend {
        max-width: 100%;
        padding: 0 8px;
        font-size: 18px;
        font-weight: bold;
        overflow-wrap: anywhere;
      }

      .options {
        display: grid;
        gap: 12px;
        margin-top: 8px;
      }

      .option {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 13px 16px;
        border: 1px solid #dfe9ef;
        border-radius: 10px;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .option:hover {
        background: #f1f9f9;
      }

      .option:has(input:checked) {
        background: #eaf7f7;
        border-color: #00899a;
      }

      .option input {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        margin: 5px 0 0;
        accent-color: #00899a;
      }

      .option:has(input:disabled) {
        cursor: default;
      }

      /* 作答後的正確與錯誤選項 */
      .option.correct {
        background: #edf8f0;
        border-color: #26804b;
      }

      .option.wrong {
        background: #fff1f0;
        border-color: #be4545;
      }

      .feedback {
        margin: 16px 0 0;
        padding: 14px;
        background: #f3f6f8;
        border-radius: 8px;
        font-size: 14px;
      }

      /* 操作按鈕 */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        min-height: 48px;
        padding: 12px 24px;
        border: 0;
        border-radius: 10px;
        background: #00899a;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      .button:hover {
        background: #006b79;
      }

      .button.secondary {
        background: white;
        color: #006b79;
        border: 1px solid #00899a;
      }

      .button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      /* 成績區 */
      .result {
        margin-top: 24px;
        padding: 24px;
        background: #eaf7f7;
        border: 1px solid #b8dfe2;
        border-radius: 16px;
        text-align: center;
      }

      .result h2 {
        margin: 0 0 8px;
      }

      .result p {
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }

      footer {
        padding: 0 20px 28px;
        color: #5f7085;
        text-align: center;
        font-size: 13px;
      }

      /* 手機版 */
      @media (max-width: 600px) {
        .container {
          width: calc(100% - 24px);
        }

        main {
          padding: 24px 0;
        }

        .question-card {
          padding: 18px 14px;
        }

        .question-card legend {
          font-size: 16px;
        }

        .option {
          padding: 12px;
          font-size: 15px;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header class="header">
      <nav class="container navbar" aria-label="主要導覽">
        <a class="logo" href="../index.html">&lt;/&gt; 網頁前端入門</a>
        <a href="../index.html">← 返回課程首頁</a>
      </nav>
    </header>

    <main class="container">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">CHECK YOUR LEARNING</p>
        <h1 id="page-title">課後小測驗</h1>
        <p class="description">
          完成五題單選題，看看你是否掌握 HTML 與 CSS 的基本概念！ 每題 20 分，滿分 100 分。
        </p>
        <p class="progress" id="progress" aria-live="polite">已完成 0 / 5 題</p>
      </section>

      <noscript>請啟用 JavaScript，才能顯示題目與計算成績。</noscript>

      <form id="quiz-form">
        <div id="questions"></div>

        <div class="actions">
          <button class="button" id="submit-button" type="submit">送出答案</button>
          <button class="button secondary" type="reset">重新作答</button>
        </div>
      </form>

      <section class="result" id="result" aria-labelledby="result-title" tabindex="-1" hidden>
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
      </section>
    </main>

    <footer>網頁前端入門｜數位學習內容設計</footer>

    <script>
      // answer 是正確選項的位置，從 0 開始計算。
      const questions = [
        {
          title: 'HTML 在網頁中主要負責什麼？',
          options: [
            '設定文字的顏色與大小',
            '建立網頁的內容與結構',
            '設定卡片的陰影與圓角',
            '調整滑鼠移入時的背景顏色',
          ],
          answer: 1,
          explanation:
            'HTML 用來建立網頁的內容與結構，例如標題、段落、圖片與連結；外觀樣式則可以使用 CSS 設定。',
        },
        {
          title: '在個人介紹卡中，哪個標籤適合用來標示最高層級的標題？',
          options: ['<p>', '<img>', '<h1>', '<a>'],
          answer: 2,
          explanation:
            '<h1> 表示最高層級的標題；<p> 是段落、<img> 用來放圖片，<a> 搭配 href 可以建立連結。',
        },
        {
          title: '想在介紹卡中顯示個人照片，應使用哪個寫法？',
          options: [
            '<img src="avatar.jpg" alt="個人照片">',
            '<a href="avatar.jpg">個人照片</a>',
            '<p>avatar.jpg</p>',
            '<h1>avatar.jpg</h1>',
          ],
          answer: 0,
          explanation:
            '<img> 可以顯示圖片，src 指定圖片路徑，alt 提供替代文字。<a> 的寫法會建立連結，不會直接把照片顯示在卡片中。',
        },
        {
          title: '想讓「我的 YouTube」文字成為可點擊的連結，應使用哪個寫法？',
          options: [
            '<p href="https://www.youtube.com/">我的 YouTube</p>',
            '<a src="https://www.youtube.com/">我的 YouTube</a>',
            '<h1 href="https://www.youtube.com/">我的 YouTube</h1>',
            '<a href="https://www.youtube.com/">我的 YouTube</a>',
          ],
          answer: 3,
          explanation:
            '建立超連結需要使用 <a> 標籤，並透過 href 指定目的地網址。src 不能用來設定 <a> 的連結目的地。',
        },
        {
          title: '想將介紹卡的背景改為淺綠色，應修改哪個 CSS 屬性？',
          options: ['color', 'background-color', 'font-size', 'border-radius'],
          answer: 1,
          explanation:
            'background-color 設定背景顏色；color 設定文字顏色；font-size 設定文字大小；border-radius 設定圓角。',
        },
      ];

      const form = document.querySelector('#quiz-form');
      const questionContainer = document.querySelector('#questions');
      const progress = document.querySelector('#progress');
      const submitButton = document.querySelector('#submit-button');
      const result = document.querySelector('#result');
      const letters = ['A', 'B', 'C', 'D'];

      // 建立題目，使用 textContent 讓 HTML 標籤以文字顯示。
      questions.forEach((question, index) => {
        const fieldset = document.createElement('fieldset');
        fieldset.className = 'question-card';

        const legend = document.createElement('legend');
        legend.textContent = `${index + 1}. ${question.title}`;
        fieldset.appendChild(legend);

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement('label');
          label.className = 'option';

          const input = document.createElement('input');
          input.type = 'radio';
          input.name = `q${index}`;
          input.value = optionIndex;
          input.required = true;

          const text = document.createElement('span');
          text.textContent = `${letters[optionIndex]}. ${option}`;

          label.append(input, text);
          options.appendChild(label);
        });

        const feedback = document.createElement('p');
        feedback.className = 'feedback';
        feedback.id = `feedback-${index}`;
        feedback.hidden = true;

        fieldset.append(options, feedback);
        questionContainer.appendChild(fieldset);
      });

      // 顯示作答進度。
      form.addEventListener('change', () => {
        const count = form.querySelectorAll('input:checked').length;
        progress.textContent = `已完成 ${count} / ${questions.length} 題`;
      });

      // 原生表單驗證會要求每題都作答後才能送出。
      form.addEventListener('submit', (event) => {
        event.preventDefault();

        let correctCount = 0;

        questions.forEach((question, index) => {
          const selected = form.querySelector(`input[name="q${index}"]:checked`);
          const isCorrect = Number(selected.value) === question.answer;

          if (isCorrect) correctCount++;

          const inputs = form.querySelectorAll(`input[name="q${index}"]`);

          inputs.forEach((input) => {
            const label = input.closest('.option');

            if (Number(input.value) === question.answer) {
              label.classList.add('correct');
            } else if (input.checked) {
              label.classList.add('wrong');
            }

            // 送出後鎖定答案，重新作答時解除。
            input.disabled = true;
          });

          const feedback = document.querySelector(`#feedback-${index}`);
          feedback.textContent =
            `${isCorrect ? '✓ 答對了！' : '✕ 答錯了。'} ` +
            `正確答案：${letters[question.answer]}。` +
            question.explanation;
          feedback.hidden = false;
        });

        const score = correctCount * 20;

        document.querySelector('#result-title').textContent = `測驗成績：${score} 分`;

        document.querySelector('#result-message').textContent =
          `共答對 ${correctCount} / ${questions.length} 題。` +
          (score === 100
            ? '全部答對！接著試著完成自己的個人介紹卡吧。'
            : '可以查看各題解析，再回到課程複習並重新挑戰。');

        submitButton.disabled = true;
        result.hidden = false;
        result.focus();
      });

      // 清除答案、解析與成績。
      form.addEventListener('reset', () => {
        form.querySelectorAll('input').forEach((input) => {
          input.disabled = false;
        });

        form.querySelectorAll('.option').forEach((label) => {
          label.classList.remove('correct', 'wrong');
        });

        form.querySelectorAll('.feedback').forEach((feedback) => {
          feedback.hidden = true;
          feedback.textContent = '';
        });

        submitButton.disabled = false;
        result.hidden = true;
        progress.textContent = `已完成 0 / ${questions.length} 題`;

        // 等瀏覽器完成表單重設後，再將焦點移到第一題。
        requestAnimationFrame(() => {
          form.querySelector('input').focus();
        });
      });
    </script>
  </body>
</html>
